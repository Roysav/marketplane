syntax = "proto3";

package marketplane.apiserver.v1;

import "google/type/decimal.proto";
import "google/protobuf/struct.proto";

service ApiserverService {
  rpc PublishTick(PublishTickRequest) returns (PublishTickResponse);
  rpc GetTick(GetTickRequest) returns (GetTickResponse);
  rpc SubscribeTick(SubscribeTickRequest) returns (stream TickUpdate);

  rpc Allocate(AllocateRequest) returns (AllocateResponse);
  rpc Grant(GrantRequest) returns (GrantResponse);
  rpc Balance(BalanceRequest) returns (BalanceResponse);

  rpc CreateRecord(CreateRecordRequest) returns (CreateRecordResponse);
  rpc UpdateRecord(UpdateRecordRequest) returns (UpdateRecordResponse);
  rpc GetRecord(GetRecordRequest) returns (GetRecordResponse);
  rpc ListRecords(ListRecordsRequest) returns (ListRecordsResponse);
  rpc WatchRecords(WatchRecordsRequest) returns (stream RecordEvent);
}

// --- ticks ---

message PublishTickRequest {
  string name = 1;
  google.protobuf.Value value = 2;
}

message PublishTickResponse {}

message GetTickRequest {
  string name = 1;
}

message GetTickResponse {
  google.protobuf.Value value = 1;
}

message SubscribeTickRequest {
  string name = 1;
}

message TickUpdate {
  google.protobuf.Value value = 1;
}

// --- ledger ---

message AllocateRequest {
  string from_principal = 1;
  string to_principal = 2;
  string currency = 3;
  google.type.Decimal amount = 4;
  string subject = 5;
}

message AllocateResponse {}

message GrantRequest {
  string from_principal = 1;
  string to_principal = 2;
  string currency = 3;
  google.type.Decimal amount = 4;
  string subject = 5;
}

message GrantResponse {}

message BalanceRequest {
  string principal = 1;
  string currency = 2;
}

message BalanceResponse {
  google.type.Decimal balance = 1;
}

// --- records ---

message RecordMetadata {
  string name = 1;
  map<string, string> labels = 2;
  int64 revision = 3;
}

message Record {
  string type = 1;
  string tradespace = 2;
  RecordMetadata metadata = 3;
  google.protobuf.Struct spec = 4;
}

message CreateRecordRequest {
  Record record = 1;
}

message CreateRecordResponse {}

message UpdateRecordRequest {
  Record record = 1;
}

message UpdateRecordResponse {}

message GetRecordRequest {
  string type = 1;
  string tradespace = 2;
  string name = 3;
}

message GetRecordResponse {
  Record record = 1;
}

message ListRecordsRequest {
  string type = 1;
  string tradespace = 2;
  bool all_tradespaces = 3;
  map<string, string> labels = 4;
}

message ListRecordsResponse {
  repeated Record records = 1;
}

message WatchRecordsRequest {
  string type = 1;
  string tradespace = 2;
  bool all_tradespaces = 3;
}

message RecordEvent {
  string action = 1;
  string type = 2;
  string tradespace = 3;
  string name = 4;
  Record record = 5;
}
