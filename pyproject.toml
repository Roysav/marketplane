[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplane"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.66",
    "grpcio-reflection>=1.66",
    "protobuf>=5.27",
    "googleapis-common-protos>=1.63",
    "asyncpg>=0.29",
    "redis[hiredis]>=5.0",
    "pydantic>=2.7",
    "pydantic-settings[yaml]>=2.3",
    "websockets>=13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "grpcio-tools>=1.66",
]

[tool.setuptools.packages.find]
where = ["src", "gen"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "gen"]
testpaths = ["tests"]
markers = ["integration: tests that hit real Postgres/Redis"]
