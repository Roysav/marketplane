[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplane"
version = "0.1.0"
description = "Async gRPC trading platform backed by Postgres and Redis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Marketplane" }]

dependencies = [
    # gRPC core
    "grpcio>=1.66",
    "grpcio-tools>=1.66",
    "grpcio-health-checking>=1.66",
    "grpcio-reflection>=1.66",
    "protobuf>=7.35.1",

    # Database (async)
    "SQLAlchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",

    # Cache
    "redis[hiredis]>=5.0",

    # Config & validation
    "pydantic>=2.7",
    "pydantic-settings[yaml]>=2.3",
    "googleapis-common-protos>=1.63",

    # Observability
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-grpc>=0.46b0",

    # Auth
    "pyjwt[crypto]>=2.8",

    # Controllers
    "websockets>=13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "types-protobuf>=5.27",
]

[project.scripts]
marketplane = "marketplane.__main__:main"

[tool.setuptools.packages.find]
where = ["src", "gen"]
namespaces = true

[tool.setuptools.package-data]
marketplane = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "gen"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=apiserver --cov-report=term-missing"
markers = [
    "integration: tests that hit real Postgres/Redis (require docker-compose up)",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["gen/"]

[[tool.mypy.overrides]]
module = "marketplane.apiserver.v1.*"
ignore_errors = true
