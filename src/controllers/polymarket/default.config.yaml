logging:
  version: 1
  disable_existing_loggers: false
  formatters:
    standard:
      format: "%(asctime)s %(levelname)s %(name)s %(message)s"
  handlers:
    console:
      class: "logging.StreamHandler"
      formatter: standard
  loggers:
    controller:
      level: "INFO"
      handlers: [console]
      propagate: false
    controllers.polymarket:
      level: "INFO"
      handlers: [console]
      propagate: false
  root:
    level: "WARNING"
    handlers: [console]

marketplane:
  maxMessageBytes: 268435456

controller:
  reconnectBackoff: 1.0
  resyncInterval: 30.0

polymarket:
  marketChannelUrl: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  gammaApiUrl: "https://gamma-api.polymarket.com"
  cronInterval: 60.0
  pageSize: 100
  maxConcurrency: 10
  maxAssets: 10000
  pingTimeout: 30.0
